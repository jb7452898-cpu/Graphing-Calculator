<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graphing Calculator - Quadratics & Systems</title>
  <!-- Math.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.js"></script>
  <style>
    :root {
      --bg: #1e1e2e;
      --panel: #2b2b3d;
      --accent: #89b4fa;
      --green: #a6e3a1;
      --red: #f38ba8;
      --text: #cdd6f4;
      --border: #45475a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

    .sidebar { width: 440px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; gap: 16px; overflow-y: auto; }
    .main-canvas { flex: 1; position: relative; background: #11111b; }
    canvas { width: 100%; height: 100%; display: block; }

    h2 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin-bottom: 6px; }
    .section { background: rgba(0,0,0,0.2); padding: 14px; border-radius: 8px; border: 1px solid var(--border); }

    input, textarea {
      width: 100%; padding: 10px; background: #181825; border: 1px solid var(--border);
      color: #fff; border-radius: 6px; font-size: 0.95rem; font-family: monospace; outline: none;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { height: 120px; resize: vertical; line-height: 1.4; }

    .status-badge {
      display: inline-block; padding: 6px 10px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; margin-top: 8px; width: 100%; text-align: center;
    }
    .status-solved { background: rgba(166, 227, 161, 0.2); color: var(--green); border: 1px solid var(--green); }
    .status-unsolved { background: rgba(243, 139, 168, 0.2); color: var(--red); border: 1px solid var(--red); }

    .step-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .step-item {
      display: flex; align-items: center; justify-content: space-between;
      background: #181825; padding: 8px 12px; border-radius: 6px; font-family: monospace;
      border: 1px solid var(--border); font-size: 0.9rem;
    }
    .check { color: var(--green); font-weight: bold; font-size: 1.1rem; }
    .invalid { color: var(--red); }

    .instructions { font-size: 0.8rem; color: #a6adc8; line-height: 1.3; }
    .preset-btn { background: #313244; color: var(--text); border: 1px solid var(--border); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; margin-right: 4px; margin-top: 6px;}
    .preset-btn:hover { background: var(--accent); color: #11111b; }
  </style>
</head>
<body>

  <div class="sidebar">
    <!-- Problem Target Area -->
    <div class="section">
      <h2>1. Target Problem Box</h2>
      <p class="instructions">Single Eq: <code>x^2 - 5x + 6 = 0</code><br>System (2 lines): <code>2x + y = 7</code> & <code>x - y = 1</code></p>
      <textarea id="targetProblem" style="height: 60px; margin-top: 6px;">x^2 - 5x + 6 = 0</textarea>

      <div>
        <button class="preset-btn" onclick="loadPreset('quadratic')">Load Quadratic Ex.</button>
        <button class="preset-btn" onclick="loadPreset('system')">Load System Ex.</button>
      </div>

      <div id="solutionBadge" class="status-badge status-unsolved">Searching for Solution...</div>
    </div>

    <!-- Workspace Area -->
    <div class="section" style="flex: 1; display: flex; flex-direction: column;">
      <h2>2. Workspace Area</h2>
      <p class="instructions">Solve step-by-step. For systems, finish with <code>x=3, y=1</code> or <code>(3, 1)</code>.</p>
      <textarea id="workspace" style="margin-top: 6px;" placeholder="(x - 2)(x - 3) = 0&#10;x = 2&#10;x = 3"></textarea>

      <div style="margin-top: 10px;">
        <h3 style="font-size: 0.85rem; color: var(--accent);">Step Verifications:</h3>
        <div id="stepResults" class="step-list"></div>
      </div>
    </div>
  </div>

  <!-- Graphing Canvas Area -->
  <div class="main-canvas">
    <canvas id="graphCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');
    const targetInput = document.getElementById('targetProblem');
    const workspaceInput = document.getElementById('workspace');
    const stepResultsContainer = document.getElementById('stepResults');
    const solutionBadge = document.getElementById('solutionBadge');

    let width, height;
    const scale = 30; // 30px per unit
    const origin = { x: 0, y: 0 };

    function resizeCanvas() {
      width = canvas.parentElement.clientWidth;
      height = canvas.parentElement.clientHeight;
      canvas.width = width;
      canvas.height = height;
      origin.x = width / 2;
      origin.y = height / 2;
      processAll();
    }
    window.addEventListener('resize', resizeCanvas);

    function loadPreset(type) {
      if (type === 'quadratic') {
        targetInput.value = "x^2 - 5x + 6 = 0";
        workspaceInput.value = "(x - 2)(x - 3) = 0\nx = 2\nx = 3";
      } else if (type === 'system') {
        targetInput.value = "2x + y = 7\nx - y = 1";
        workspaceInput.value = "3x = 8\ny = 2x - 7\nx = 2.6667, y = 1.6667";
      }
      processAll();
    }

    function parseSide(exprStr) {
      if (!exprStr || !exprStr.trim()) return null;
      try { return math.parse(exprStr); } catch (e) { return null; }
    }

    // Dynamic function evaluator supporting single or multi-variable contexts
    function getDiffFunction(nodeLeft, nodeRight) {
      try {
        const diffNode = new math.OperatorNode('-', 'subtract', [nodeLeft, nodeRight]);
        const compiled = diffNode.compile();
        return (scope) => compiled.evaluate(scope);
      } catch (e) { return null; }
    }

    // Solves quadratic or 1D root crossings within reasonable grid bounds
    function solve1DRoots(nodeLeft, nodeRight) {
      const diffFn = getDiffFunction(nodeLeft, nodeRight);
      if (!diffFn) return [];

      const roots = [];
      const step = 0.1;
      let prevVal = diffFn({ x: -20, y: 0 });

      for (let x = -20; x <= 20; x += step) {
        let val = diffFn({ x: x, y: 0 });
        if (Math.abs(val) < 1e-5) {
          if (!roots.some(r => Math.abs(r - x) < 1e-3)) roots.push(x);
        } else if (prevVal * val < 0) {
          // Bisection refinement for sign changes
          let low = x - step, high = x;
          for (let i = 0; i < 15; i++) {
            let mid = (low + high) / 2;
            let midVal = diffFn({ x: mid, y: 0 });
            if (diffFn({ x: low, y: 0 }) * midVal < 0) high = mid;
            else low = mid;
          }
          let approxRoot = (low + high) / 2;
          if (!roots.some(r => Math.abs(r - approxRoot) < 1e-3)) roots.push(approxRoot);
        }
        prevVal = val;
      }
      return roots;
    }

    // Solve 2x2 System of Linear Equations
    function solveLinearSystem(targetLines) {
      if (targetLines.length !== 2) return null;
      try {
        const parsed = targetLines.map(l => {
          const p = l.split('=').map(s => s.trim());
          const diff = getDiffFunction(parseSide(p[0]), parseSide(p[1]));
          return diff;
        });

        if (!parsed[0] || !parsed[1]) return null;

        // Extract linear coefficients using sample offsets
        const f1 = parsed[0], f2 = parsed[1];
        const c1 = f1({ x: 0, y: 0 });
        const a1 = f1({ x: 1, y: 0 }) - c1;
        const b1 = f1({ x: 0, y: 1 }) - c1;

        const c2 = f2({ x: 0, y: 0 });
        const a2 = f2({ x: 1, y: 0 }) - c2;
        const b2 = f2({ x: 0, y: 1 }) - c2;

        // Matrix form: A * [x, y]^T = -C
        const res = math.lusolve([[a1, b1], [a2, b2]], [-c1, -c2]);
        const xSol = res[0][0];
        const ySol = res[1][0];

        if (!isNaN(xSol) && !isNaN(ySol)) {
          return { x: xSol, y: ySol };
        }
      } catch (e) { return null; }
      return null;
    }

    // Verify equivalence for quadratic or multi-variable equations
    function checkEquivalence(targetNodes, stepLeft, stepRight, targetSol) {
      const stepDiff = getDiffFunction(stepLeft, stepRight);
      if (!stepDiff) return false;

      // Handle 2D System equivalence against any line in the system
      if (targetSol && targetSol.systemPoint) {
        return targetNodes.some(target => {
          const tDiff = getDiffFunction(target.left, target.right);
          if (!tDiff) return false;
          // Check if stepDiff zeroes out at system solution
          return Math.abs(stepDiff(targetSol.systemPoint)) < 1e-4;
        });
      }

      // Handle Single-Variable/Quadratic equivalence
      if (targetNodes.length > 0) {
        const tDiff = getDiffFunction(targetNodes[0].left, targetNodes[0].right);
        if (!tDiff) return false;

        // Proportional check
        let sample1_t = tDiff({ x: 1, y: 0 }), sample1_s = stepDiff({ x: 1, y: 0 });
        let sample2_t = tDiff({ x: 3, y: 0 }), sample2_s = stepDiff({ x: 3, y: 0 });

        if (sample1_t !== 0 && sample2_t !== 0) {
          let ratio1 = sample1_s / sample1_t;
          let ratio2 = sample2_s / sample2_t;
          if (Math.abs(ratio1 - ratio2) < 1e-4 && Math.abs(ratio1) > 1e-6) return true;
        }

        // Shared Root Check for single root expressions (e.g. x = 2)
        if (targetSol && targetSol.roots) {
          const rootMatches = targetSol.roots.some(r => Math.abs(stepDiff({ x: r, y: 0 })) < 1e-4);
          if (rootMatches) return true;
        }
      }
      return false;
    }

function processAll() {
      const targetText = targetInput.value.trim();
      const targetLines = targetText.split('\n').map(l => l.trim()).filter(l => l.length > 0);

      let targetNodes = [];
      let targetSol = { roots: [], systemPoint: null };
      let isSystem = targetLines.length > 1;

      targetLines.forEach(line => {
        const parts = line.split('=').map(s => s.trim());
        if (parts.length === 2) {
          const left = parseSide(parts[0]), right = parseSide(parts[1]);
          if (left && right) targetNodes.push({ left, right });
        }
      });

      if (isSystem) {
        targetSol.systemPoint = solveLinearSystem(targetLines);
      } else if (targetNodes.length === 1) {
        targetSol.roots = solve1DRoots(targetNodes[0].left, targetNodes[0].right);
      }

      // Process Workspace Lines
      const workspaceLines = workspaceInput.value.split('\n').filter(l => l.trim().length > 0);
      stepResultsContainer.innerHTML = '';

      let foundRoots = new Set();
      let systemSolved = false;
      const validGraphNodes = [];

      workspaceLines.forEach((line) => {
        const stepDiv = document.createElement('div');
        stepDiv.className = 'step-item';

        // Helper regex to extract numbers from formats like (2.67, 1.67) or x=2.67, y=1.67
        let isSystemSolutionLine = false;
        if (isSystem && targetSol.systemPoint) {
          const pt = targetSol.systemPoint;
          const nums = line.match(/-?\d+(\.\d+)?/g);

          if (nums && nums.length >= 2) {
            const val1 = parseFloat(nums[0]);
            const val2 = parseFloat(nums[1]);

            // Check if extracted numbers match target intersection (x, y)
            if (Math.abs(val1 - pt.x) < 0.05 && Math.abs(val2 - pt.y) < 0.05) {
              systemSolved = true;
              isSystemSolutionLine = true;
            }
          }
        }

        // Check single root assignments for quadratics/1D (e.g. x = 2)
        let matchedSingleRoot = false;
        if (!isSystem && targetSol.roots.length > 0) {
          targetSol.roots.forEach(r => {
            const nums = line.match(/-?\d+(\.\d+)?/g);
            if (nums && nums.some(n => Math.abs(parseFloat(n) - r) < 0.05)) {
              foundRoots.add(r);
              matchedSingleRoot = true;
            }
          });
        }

        // Process equivalence and render status checks
        const parts = line.split('=').map(s => s.trim());

        if (isSystemSolutionLine) {
          // Explicitly pass coordinate notation (2.67, 1.67) without sending to Math.js parser
          stepDiv.innerHTML = `<span>${line}</span><span class="check">✓</span>`;
        } else if (parts.length === 2 || matchedSingleRoot) {
          const leftNode = parseSide(parts[0]);
          const rightNode = parseSide(parts[1]);

          if ((leftNode && rightNode) || matchedSingleRoot) {
            const equivalent = matchedSingleRoot || checkEquivalence(targetNodes, leftNode, rightNode, targetSol);

            if (equivalent) {
              stepDiv.innerHTML = `<span>${line}</span><span class="check">✓</span>`;
              if (leftNode && rightNode) validGraphNodes.push({ left: leftNode, right: rightNode });
            } else {
              stepDiv.innerHTML = `<span>${line}</span><span class="invalid">✗ (Not Equivalent)</span>`;
            }
          } else {
            stepDiv.innerHTML = `<span>${line}</span><span class="invalid">Syntax Error</span>`;
          }
        } else {
          stepDiv.innerHTML = `<span>${line}</span><span class="invalid">Invalid Format</span>`;
        }

        stepResultsContainer.appendChild(stepDiv);
      });

      // Solved State Updates
      let isFullySolved = false;
      if (isSystem) {
        isFullySolved = systemSolved;
      } else {
        isFullySolved = targetSol.roots.length > 0 && targetSol.roots.every(r => foundRoots.has(r));
      }

      if (isFullySolved) {
        solutionBadge.className = 'status-badge status-solved';
        solutionBadge.innerText = 'EQUATION SOLVED 🎉';
      } else {
        solutionBadge.className = 'status-badge status-unsolved';
        if (isSystem && targetSol.systemPoint) {
          solutionBadge.innerText = `Target Intersect: (${targetSol.systemPoint.x.toFixed(2)}, ${targetSol.systemPoint.y.toFixed(2)})`;
        } else if (targetSol.roots.length > 0) {
          solutionBadge.innerText = `Target Roots: x = [${targetSol.roots.map(r => r.toFixed(2)).join(', ')}]`;
        } else {
          solutionBadge.innerText = 'Searching for Solution...';
        }
      }

      renderGraph(validGraphNodes, targetSol);
    }


    // Render Function Plots and Solution Guides
    function renderGraph(validNodes, targetSol) {
      ctx.clearRect(0, 0, width, height);

      // Render Grid
      ctx.strokeStyle = '#2a2b3d';
      ctx.lineWidth = 1;
      for (let x = origin.x % scale; x < width; x += scale) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
      }
      for (let y = origin.y % scale; y < height; y += scale) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
      }

      // Axes
      ctx.strokeStyle = '#6c7086'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(origin.x, 0); ctx.lineTo(origin.x, height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, origin.y); ctx.lineTo(width, origin.y); ctx.stroke();

      const colors = ['#89b4fa', '#f9e2af', '#a6e3a1', '#cba6f7', '#f38ba8'];

      // Plot equations dynamically
      validNodes.forEach((nodePair, idx) => {
        const diffFn = getDiffFunction(nodePair.left, nodePair.right);
        if (!diffFn) return;

        ctx.strokeStyle = colors[idx % colors.length];
        ctx.lineWidth = 2;
        ctx.beginPath();

        let first = true;
        for (let pixelX = 0; pixelX < width; pixelX += 2) {
          const mathX = (pixelX - origin.x) / scale;
          try {
            // Evaluates y = f(x)
            const mathY = diffFn({ x: mathX, y: 0 });
            const pixelY = origin.y - (mathY * scale);

            if (first) { ctx.moveTo(pixelX, pixelY); first = false; }
            else { ctx.lineTo(pixelX, pixelY); }
          } catch (e) {}
        }
        ctx.stroke();
      });

      // Render Vertical Root Guide Lines for 1D / Quadratics
      if (targetSol.roots && targetSol.roots.length > 0) {
        targetSol.roots.forEach(r => {
          const rx = origin.x + (r * scale);
          ctx.setLineDash([5, 5]);
          ctx.strokeStyle = '#a6e3a1';
          ctx.beginPath(); ctx.moveTo(rx, 0); ctx.lineTo(rx, height); ctx.stroke();
          ctx.setLineDash([]);
        });
      }

      // Render Solution Intersection Point for Systems
      if (targetSol.systemPoint) {
        const px = origin.x + (targetSol.systemPoint.x * scale);
        const py = origin.y - (targetSol.systemPoint.y * scale);

        ctx.fillStyle = '#f38ba8';
        ctx.beginPath();
        ctx.arc(px, py, 6, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    targetInput.addEventListener('input', processAll);
    workspaceInput.addEventListener('input', processAll);

    resizeCanvas();
  </script>
</body>
</html>
